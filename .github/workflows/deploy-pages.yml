name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          TOPTRUMP_API_URL: ${{ vars.TOPTRUMP_API_URL }}
        run: |
          if [ -z "$TOPTRUMP_API_URL" ]; then
            echo "::error::Configure the TOPTRUMP_API_URL Actions variable with the HTTPS URL of the PHP API."
            exit 1
          fi
          php scripts/build-github-pages.php
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
